version: "3.9"

services:
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - db
      - nlp_service

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_pass
      POSTGRES_DB: bot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nlp_service:
    build: ./nlp_service
    container_name: nlp_service
    ports:
      - "50051:50051"

volumes:
  pgdata:
